<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanline</title>
  <link rel="stylesheet" href="../../styles/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brand"><span>Scanline</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="btnHistory" type="button" title="Scan history" aria-label="Scan history"></button>
      <button class="icon-btn" id="btnReport" type="button" title="Open full report" aria-label="Open full report" disabled></button>
      <button class="icon-btn" id="btnSettings" type="button" title="Settings" aria-label="Settings"></button>
      <button class="btn primary" id="btnScan" type="button">Scan</button>
    </div>
  </header>
  <main id="view" tabindex="-1" aria-live="polite"></main>
  <footer class="foot" id="foot">Runs 100% locally. Nothing leaves your browser.</footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
