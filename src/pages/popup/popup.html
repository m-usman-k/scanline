<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanline</title>
  <link rel="stylesheet" href="../../styles/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand" id="brand"><span>Scanline</span></div>
    <nav class="top-actions">
      <button class="nav-link" id="btnHistory" type="button" title="Scan history">History</button>
      <button class="nav-link" id="btnReport" type="button" title="Open full report" disabled>Report</button>
      <button class="nav-link" id="btnSettings" type="button" title="Settings">Settings</button>
      <button class="btn primary" id="btnScan" type="button">Scan</button>
    </nav>
  </header>
  <main id="view" tabindex="-1" aria-live="polite"></main>
  <footer class="foot" id="foot">Runs locally. Nothing leaves your browser.</footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
